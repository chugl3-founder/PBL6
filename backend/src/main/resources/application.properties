spring.application.name=badminton-backend
server.port=${SERVER_PORT:8080}

# PostgreSQL. Production must override these local development defaults.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/badminton_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:badminton_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:badminton_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# RabbitMQ. Production must override these local development defaults.
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:/}

# Upload limits
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# S3-compatible object storage. Defaults target the local MinIO service.
storage.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
storage.s3.public-url=${S3_PUBLIC_URL:http://localhost:9000}
storage.s3.access-key=${S3_ACCESS_KEY:minioadmin}
storage.s3.secret-key=${S3_SECRET_KEY:minioadmin}
storage.s3.region=${S3_REGION:ap-southeast-1}
storage.s3.path-style-access=${S3_PATH_STYLE_ACCESS:true}
storage.s3.bucket.videos=${S3_BUCKET_VIDEOS:badminton-videos}
storage.s3.bucket.avatars=${S3_BUCKET_AVATARS:badminton-avatars}

# JWT Security. Production must override JWT_SECRET.
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:604800000}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:604800000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
