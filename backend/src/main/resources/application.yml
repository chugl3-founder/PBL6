server:
  port: 8080

spring:
  application:
    name: badminton-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/badminton_db}
    username: ${SPRING_DATASOURCE_USERNAME:badminton_user}
    password: ${SPRING_DATASOURCE_PASSWORD:badminton_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

# MinIO S3 Object Storage Config
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket:
    videos: ${MINIO_BUCKET_VIDEOS:badminton-videos}
    avatars: ${MINIO_BUCKET_AVATARS:badminton-avatars}

# JWT Security
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration-ms: 1800000 # 30 minutes
  refresh-token-expiration-ms: 604800000 # 7 days

